<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookstore Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h1>📚 Bookstore</h1>

        <div class="controls">
            <div class="search-section">
                <input type="text" id="searchBook" placeholder="Search by title...">
                <select id="filterAuthor">
                    <option value="">All Authors</option>
                </select>
                <select id="filterPublisher">
                    <option value="">All Publishers</option>
                </select>
                <button onclick="searchBooks()">Search</button>
            </div>
            <button class="add-book-btn" onclick="openAddModal()">+ Add New Book</button>
        </div>

        <div id="errorMessage" class="error" style="display: none;"></div>
        <div id="loadingMessage" class="loading">Loading books...</div>
        <div id="booksContainer" class="books-grid"></div>
    </div>

    <!-- Add/Edit Book Modal -->
    <div id="bookModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Add New Book</h2>
            <form id="bookForm">
                <div class="form-group">
                    <label for="title">Title *</label>
                    <input type="text" id="title" required>
                </div>
                <div class="form-group">
                    <label for="description">Description *</label>
                    <textarea id="description" required></textarea>
                </div>
                <div class="form-group">
                    <label for="price">Price *</label>
                    <input type="number" id="price" min="1" required>
                </div>
                <div class="form-group">
                    <label for="author">Author *</label>
                    <select id="author" required></select>
                </div>
                <div class="form-group">
                    <label for="publisher">Publisher *</label>
                    <select id="publisher" required></select>
                </div>
                <div class="form-group">
                    <label for="pages">Pages *</label>
                    <input type="number" id="pages" min="1" required>
                </div>
                <div class="form-group">
                    <label for="year">Year *</label>
                    <input type="number" id="year" min="1900" required>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="available">
                    <label for="available">Available</label>
                </div>
                <div class="form-actions">
                    <button type="button" class="cancel-btn" onclick="closeModal()">Cancel</button>
                    <button type="submit">Save Book</button>
                </div>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
